name: Build and publish OAB Studio

# Every push to main with a NEW version in desktop/package.json (or a run by hand) builds
# OAB-Studio-Setup-x.y.z.exe on Windows and publishes it as release vx.y.z.
# Installed copies of OAB Studio update themselves from the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build again and replace the files of the current version
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      skip: ${{ steps.v.outputs.skip }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.rebuild }}" = "true" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; echo "Rebuilding $VER"; elif gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "v$VER is already released – nothing to build"; else echo "skip=0" >> "$GITHUB_OUTPUT"; echo "Building $VER"; fi

      - name: Install
        if: steps.v.outputs.skip == '0'
        run: npm ci

      - name: Python for the OAB server
        if: steps.v.outputs.skip == '0'
        run: |
          curl -sL -o py.tgz "https://github.com/astral-sh/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-x86_64-pc-windows-msvc-install_only.tar.gz"
          mkdir -p resources && tar -xzf py.tgz -C resources && rm py.tgz
          cd resources/python
          rm -rf Lib/test Lib/idlelib Lib/tkinter Lib/turtledemo tcl include Scripts libs Lib/ensurepip Lib/lib2to3 Lib/pydoc_data
          find . -name "*.pdb" -delete
          find . -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Package the app
        if: steps.v.outputs.skip == '0'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --dir --x64 --publish never

      - name: Update settings
        if: steps.v.outputs.skip == '0'
        run: |
          printf 'owner: aviadderi1\nrepo: OAB-\nprovider: github\nupdaterCacheDirName: oab-studio-updater\n' > "dist/win-unpacked/resources/app-update.yml"

      - name: Installer
        if: steps.v.outputs.skip == '0'
        run: |
          MK="/c/Program Files (x86)/NSIS/makensis.exe"
          for t in 1 2 3; do [ -f "$MK" ] || [ -f "/c/Program Files/NSIS/makensis.exe" ] && break; choco install nsis -y --no-progress || sleep 10; done
          if [ ! -f "$MK" ]; then MK="/c/Program Files/NSIS/makensis.exe"; fi
          "$MK" -V2 -DVERSION=${{ steps.v.outputs.ver }} installer.nsi
          node -e "
            const fs=require('fs'),c=require('crypto');
            const f='OAB-Studio-Setup-${{ steps.v.outputs.ver }}.exe', b=fs.readFileSync('dist/'+f);
            const sha=c.createHash('sha512').update(b).digest('base64');
            fs.writeFileSync('dist/latest.yml',
              'version: ${{ steps.v.outputs.ver }}\nfiles:\n  - url: '+f+'\n    sha512: '+sha+'\n    size: '+b.length+'\npath: '+f+'\nsha512: '+sha+'\nreleaseDate: \''+new Date().toISOString()+'\'\n');"

      - name: Publish release
        if: steps.v.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.v.outputs.ver }}
          gh release create "v$V" "dist/OAB-Studio-Setup-$V.exe" dist/latest.yml \
            --title "OAB Studio $V" --notes "OAB Studio $V – download OAB-Studio-Setup-$V.exe and install. Installed copies update by themselves." \
            || gh release upload "v$V" "dist/OAB-Studio-Setup-$V.exe" dist/latest.yml --clobber
      - name: Remove the old Mac files (OAB is Windows only)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName'); do
            gh release view "$t" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | { grep -E '\.dmg$' || true; } | while read a; do
              gh release delete-asset "$t" "$a" -R "$GITHUB_REPOSITORY" -y && echo "removed $t/$a"; done
          done

  android:
    # OAB Mobile – the phone studio as an APK, attached to the same release
    # runs every time: a change to the phone app replaces the APK in the current release
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Signing key
        working-directory: android/app
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          OAB_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > oab-mobile.jks; else
            keytool -genkeypair -keystore oab-mobile.jks -storepass oabmobile -keypass oabmobile -alias oab -keyalg RSA -keysize 2048 -validity 12000 -dname "CN=AD SOUND and SERVICE, O=OAB"; fi
      - name: Build the APK
        working-directory: android
        env:
          OAB_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ needs.windows.outputs.ver }}
          cp android/app/build/outputs/apk/release/app-release.apk "OAB-Mobile-$V.apk"
          cp "OAB-Mobile-$V.apk" OAB-Mobile.apk   # fixed name: the studio's download link always gets the newest app
          gh release upload "v$V" "OAB-Mobile-$V.apk" OAB-Mobile.apk --clobber -R "$GITHUB_REPOSITORY"
