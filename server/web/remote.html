<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0E11">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3"><link rel="icon" type="image/x-icon" href="/oab.ico?v=3">
<title>OAB · Remote</title>
<style>
:root{--bg:#0D0E11;--panel:#15171C;--line:#23262E;--txt:#E8EAEF;--sub:#9097A6;--acc:#2D8CEB;--red:#F04444;--green:#22C55E;--amber:#F5A524}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 Inter,system-ui,sans-serif;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
h1{font-size:16px;margin:0 0 2px;letter-spacing:.06em}.sub{color:var(--sub);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.lbl{font-size:10.5px;letter-spacing:.1em;color:var(--sub);font-weight:700;margin-bottom:8px}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
button{background:#1B1E24;border:1px solid #2A2E37;color:var(--txt);border-radius:12px;height:56px;font:600 14px Inter,system-ui,sans-serif}
button:active{transform:scale(.97);background:#262A33}
.pri{background:#13233A;border-color:#2D5C94;color:#8CC2FF}.red{background:#3A1416;border-color:#6B2226;color:#FF9A9A}.grn{background:#122A22;border-color:#1F5A43;color:#7FE0B5}
input{width:100%;height:42px;border-radius:10px;border:1px solid #2A2E37;background:#0F1115;color:var(--txt);padding:0 12px;font-size:15px}
#now{font-size:17px;font-weight:700;margin-top:4px}#msg{min-height:18px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<h1 style="display:flex;align-items:center;gap:8px"><img src="/oab-logo.png" alt="" style="width:34px;height:34px">OAB · REMOTE</h1><div class="sub">Controls the studio on your computer</div>
<div class="card"><div class="lbl">NOW ON AIR</div><div id="now">—</div><div class="sub" id="lis"></div></div>
<div class="card"><div class="lbl">PLAYER</div><div class="g">
<button data-c="play" class="grn">▶ Play</button><button data-c="pause">❚❚ Pause</button><button data-c="next" class="pri">⏭ Next</button>
<button data-c="stop" class="red">■ Stop</button><button data-c="ads">Ad break</button><button data-c="time">Time</button></div></div>
<div class="card"><div class="lbl">MICROPHONE</div><div class="g" style="grid-template-columns:1fr 1fr"><button data-c="mic1">MIC 1</button><button data-c="mic2">MIC 2</button></div></div>
<div class="card"><div class="lbl">JINGLES</div><div class="g g5" id="carts"></div></div>
<div class="card"><div class="lbl">BROADCAST</div><div class="g" style="grid-template-columns:1fr 1fr"><button data-c="golive" class="grn">Go live</button><button data-c="stoplive" class="red">Stop broadcast</button></div></div>
<div class="card"><div class="lbl">PASSWORD</div><input id="pw" type="password" placeholder="Broadcast password" aria-label="Broadcast password"></div>
<div id="msg" class="sub"></div>
<script>
const $ = s => document.querySelector(s);
try { $('#pw').value = localStorage.getItem('radioKey') || ''; } catch(e){}
$('#pw').onchange = () => { try { localStorage.setItem('radioKey', $('#pw').value); } catch(e){} };
$('#carts').innerHTML = Array.from({ length: 10 }, (_, i) => `<button data-c="cart ${i + 1}">${(i + 1) % 10}</button>`).join('');
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-c]'); if (!b) return;
  try { const r = await fetch('/api/remote', { method: 'POST', headers: { 'X-Radio-Key': $('#pw').value, 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd: b.dataset.c }) });
    $('#msg').textContent = r.status === 401 ? 'Wrong password' : 'Sent: ' + b.textContent; }
  catch(err){ $('#msg').textContent = 'The radio server is not reachable'; }
});
async function poll(){ try { const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
  $('#now').textContent = s.onAir ? ((s.artist ? s.artist + ' – ' : '') + (s.title || 'On air')) : 'Off air'; $('#lis').textContent = s.listeners + ' listening now'; } catch(e){} }
poll(); setInterval(poll, 3000);
</script>
</body>
</html>
